# Free reminder pinger. Add two repository secrets: APP_URL (https://your-app.vercel.app) and CRON_SECRET.
# GitHub runs this about every 5 minutes (it can drift). cron-job.org every 1 minute is more punctual.
name: Send study reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.APP_URL }}/api/cron/reminders" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
